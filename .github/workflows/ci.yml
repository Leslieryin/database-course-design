name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: 静态结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 检查脚本结构
        run: python scripts/check_sql.py

  execute:
    name: 真跑（SQL Server 2022）
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiTest!Passw0rd"
          MSSQL_PID: "Developer"
          # 容器默认排序规则是 Latin1，中文会变成 ??。
          # 这个脚本的表名、约束名、默认值全是中文，原课设也是跑在
          # 中文排序规则的实例上，所以这里把实例拉回那个环境。
          # 注意：只在数据卷为空（首次初始化）时生效。
          MSSQL_COLLATION: "Chinese_PRC_CI_AS"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiTest!Passw0rd' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v7

      - name: 安装 sqlcmd
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: 确认实例用的是中文排序规则
        run: |
          # 如果 MSSQL_COLLATION 没生效，中文标识符会变 ?，
          # 后面的报错就全是假象，先在这里确认环境对不对。
          out=$(sqlcmd -S localhost -U sa -P 'CiTest!Passw0rd' -C -h -1 -W -Q "SELECT CONVERT(varchar(128), SERVERPROPERTY('Collation'))")
          echo "实例排序规则: $out"
          case "$out" in
            *Chinese_PRC*) echo "✓ 中文排序规则已生效" ;;
            *) echo "::error::排序规则不是中文，MSSQL_COLLATION 没生效"; exit 1 ;;
          esac

      - name: 把脚本里的 Windows 路径换成 Linux 路径
        run: |
          # 原脚本往 C:\SQLData\ 写数据文件，Linux runner 上没有这个盘。
          # 只动 CREATE DATABASE 里的 FILENAME，别的不管。
          sed -i 's|C:\\SQLData\\|/var/opt/mssql/data/|g' register/register.sql
          echo "替换后的数据文件路径："
          grep -o "FILENAME='[^']*'" register/register.sql | head -5
          if grep -q 'C:\\SQLData' register/register.sql; then
            echo "::error::还有残留的 Windows 路径"
            exit 1
          fi

      - name: 【诊断】一次收集所有错误（不阻断）
        continue-on-error: true
        run: |
          # 带 -b 会遇错即停，一个问题一轮，太慢。
          # 这一遍故意不用 -b，把全部错误一次打出来，方便集中修。
          set +e
          sqlcmd -S localhost -U sa -P 'CiTest!Passw0rd' -C -f 65001 -i register/register.sql > /tmp/reg.log 2>&1
          echo "=== 错误清单 ==="
          grep -E "^Msg [0-9]+" /tmp/reg.log | sort | uniq -c | sort -rn | head -30 || echo "（无 Msg 行）"
          echo ""
          echo "=== 前 3 个错误的完整上下文 ==="
          grep -A2 -E "^Msg [0-9]+" /tmp/reg.log | head -20 || true

      - name: 执行 register.sql
        run: |
          # 脚本末尾的 TRIG_科室 故意 RAISERROR（演示"插入会被拦"），
          # 所以不能要求全程零报错，否则等于逼着人删掉那个演示。
          # 这里只放行 Msg 50000，其余任何错误都算失败；
          # 对象到底建没建齐，交给下一步的验收脚本判断。
          set +e
          sqlcmd -S localhost -U sa -P 'CiTest!Passw0rd' -C -f 65001 \
            -i register/register.sql > /tmp/reg2.log 2>&1
          rc=$?
          echo "sqlcmd 退出码: $rc"
          unexpected=$(grep -E "^Msg [0-9]+" /tmp/reg2.log | grep -v "Msg 50000" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::出现了非预期错误："
            echo "$unexpected" | head -10
            exit 1
          fi
          echo "✓ 只出现了预期的触发器 RAISERROR（Msg 50000）"

      - name: 验收对象是否真的建出来了
        run: |
          sqlcmd -S localhost -U sa -P 'CiTest!Passw0rd' -C -f 65001 -b -i scripts/verify_register.sql

      - name: rent：先造桩库再执行
        run: |
          # rent.sql 开头找不到 rent 库就 RETURN，不造库等于没测
          sqlcmd -S localhost -U sa -P 'CiTest!Passw0rd' -C -f 65001 -b -i scripts/stub_rent.sql
          sqlcmd -S localhost -U sa -P 'CiTest!Passw0rd' -C -f 65001 -b -i rent/rent.sql

      - name: 确认 rent 的约束确实加上了
        run: |
          sqlcmd -S localhost -U sa -P 'CiTest!Passw0rd' -C -f 65001 -b -d rent -Q "
            SET NOCOUNT ON;
            DECLARE @missing NVARCHAR(MAX) = N'';
            IF NOT EXISTS (SELECT 1 FROM sys.key_constraints WHERE name = N'UQ_租车公司名称')
                SET @missing += N'缺 UQ_租车公司名称; ';
            IF NOT EXISTS (SELECT 1 FROM sys.default_constraints WHERE name = N'DF_价格')
                SET @missing += N'缺 DF_价格; ';
            IF NOT EXISTS (SELECT 1 FROM sys.check_constraints WHERE name = N'CK_时间')
                SET @missing += N'缺 CK_时间; ';
            IF @missing <> N'' THROW 50001, @missing, 1;
            PRINT N'✓ rent：3 个约束全部就位';"
